<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EEG Emotion Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #020617;
            padding: 30px;
            border-radius: 10px;
            width: 420px;
            text-align: center;
            box-shadow: 0px 0px 15px rgba(0,255,255,0.3);
        }

        h1 {
            color: #22d3ee;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border-radius: 6px;
            border: none;
            resize: none;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #22d3ee;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #06b6d4;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>EEG Emotion Detection</h1>

    <p>Enter EEG Features (comma separated)</p>

    <textarea id="eeg" placeholder="0.4,0.3,0.8,0.9"></textarea>

    <button onclick="predict()">Predict Emotion</button>

    <div class="result" id="result"></div>
</div>

<script>
    async function predict() {
        let input = document.getElementById("eeg").value;

        let response = await fetch("/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({features: input.split(",").map(Number)})
        });

        let data = await response.json();

        if (data.error) {
            document.getElementById("result").innerHTML = "Error: " + data.error;
        } else {
            document.getElementById("result").innerHTML =
                "Predicted Emotion: " + data.predicted_emotion +
                "<br>Confidence: " + data.confidence + "%";
        }
    }
</script>

</body>
</html>
